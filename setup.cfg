[flake8]
exclude = 
    src/config/.env
    src/db/db.duckdb
    src/logs
    src/model/models
extend-ignore = 
    WPS305, WPS226, WPS111, WPS432, WPS518
per-file-ignores = 
    inference_service/app/config/__init__.py: F401, D104, WPS300, WPS412
    inference_service/app/services/__init__.py: F401, D104, WPS300, WPS412
    src/config/__init__.py: F401, D104, WPS300
    

max-local-variables = 10